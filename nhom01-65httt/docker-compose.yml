name: htkdtm_nhom01

x-tz: &tz ${TZ:-Asia/Ho_Chi_Minh}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Chua co .env - hay sao chep .env.example thanh .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chua co .env - hay sao chep .env.example thanh .env}
      POSTGRES_DB: ${POSTGRES_DB:-bi_dw}
      BI_READONLY_PASSWORD: ${BI_READONLY_PASSWORD:?Chua co .env}
      BI_APP_PASSWORD: ${BI_APP_PASSWORD:?Chua co .env}
      TZ: *tz
      PGTZ: *tz
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./src/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./src/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://bi_app:${BI_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-bi_dw}
      JWT_SECRET: ${JWT_SECRET:?Chua co JWT_SECRET trong .env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      SERVICE_KEY: ${SERVICE_KEY:?Chua co SERVICE_KEY trong .env}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_DEMO_EMAIL: ${APP_DEMO_EMAIL:-}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-}
      SUPERSET_URL: http://superset:8088
      SUPERSET_PUBLIC_URL: http://localhost:${SUPERSET_PORT:-8088}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Chua co .env}
      ETL_RUNNER_URL: http://etl-runner:8100
      TZ: *tz
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./src/frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  etl-runner:
    build:
      context: ./src
      dockerfile: etl_runner/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bi_dw}
      DBT_HOST: postgres
      SERVICE_KEY: ${SERVICE_KEY:?Chua co SERVICE_KEY trong .env}
      TZ: *tz
    ports:
      - "127.0.0.1:${ETL_RUNNER_PORT:-8100}:8100"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  superset:
    build: ./src/superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Chua co .env}
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Chua co .env}
      TZ: *tz
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  n8n:
    image: n8nio/n8n:1.76.1
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Chua co .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      GENERIC_TIMEZONE: *tz
      TZ: *tz
      # Workflow đọc các biến này bằng $env.* (xem src/n8n/README.md)
      SERVICE_KEY: ${SERVICE_KEY:?Chua co SERVICE_KEY trong .env}
      ETL_RUNNER_URL: http://etl-runner:8100
      BACKEND_URL: http://backend:8000
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./src/n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      etl-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  pg_data:
  n8n_data:
